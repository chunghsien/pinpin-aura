services:
  pinpin-aura.test:
    container_name: pinpin-aura
    build:
      context: ./docker/8.4
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'
    image: sail-8.4/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${VITE_PORT:-5173}:5173' # Vite dev server 開發用
    expose:
      - "80" # 讓 nginx-proxy 能代理
    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
      VIRTUAL_HOST: pinpin-aura.test  # 讓 nginx-proxy 知道這個容器
      VIRTUAL_PORT: 80  # 容器內部的端口
    volumes:
      - '.:/var/www/html'
    networks: 
      - sail-nginx-proxy  # 啟用代理時打開
# depends_on:
#   - mysql
#   - redis

networks:
  sail-nginx-proxy:
    name: nginx-proxy_nginx_proxy
    external: true

